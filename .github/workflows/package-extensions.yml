name: Package browser extensions

on:
  push:
    branches: [main]
    paths:
      - "platforms/browser-extension/**"
      - ".github/workflows/package-extensions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build extension ZIP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path("platforms/browser-extension")
          out = Path("public/downloads")
          out.mkdir(parents=True, exist_ok=True)

          for browser in ("chromium", "firefox"):
              source = root / browser
              target = out / f"iwas-findex-extension-{browser}.zip"
              with ZipFile(target, "w", ZIP_DEFLATED) as archive:
                  for path in sorted(source.rglob("*")):
                      if path.is_file():
                          archive.write(path, path.relative_to(source))
          PY
      - name: Commit refreshed packages
        run: |
          if git diff --quiet -- public/downloads/iwas-findex-extension-chromium.zip public/downloads/iwas-findex-extension-firefox.zip; then
            echo "Packages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/iwas-findex-extension-chromium.zip public/downloads/iwas-findex-extension-firefox.zip
          git commit -m "Refresh browser extension download packages [skip ci]"
          git push
