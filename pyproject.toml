[project]
name = "iwas-findex-core"
version = "1.0.0"
description = "Transparent market data polling and trend forecasting core."
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
